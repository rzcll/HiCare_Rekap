<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
      
      body { 
        font-family: 'Outfit', sans-serif; 
        background: linear-gradient(135deg, #eef2f7 0%, #e2e8f0 100%);
        margin: 0;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .nav-item {
        position: relative;
        font-weight: 600;
        color: #6b7280; 
        transition: all 0.3s ease;
      }

      .nav-item.active {
        color: #4f46e5; 
      }

      .nav-item.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #4f46e5, #818cf8);
        border-radius: 3px 3px 0 0;
      }

      .form-input:hover, .form-select:hover {
        border-color: #a5b4fc; 
        box-shadow: 0 0 0 4px rgba(165, 180, 252, 0.2);
      }

      .form-input:focus, .form-select:focus {
        border-color: #4f46e5; 
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.25) !important;
      }

      /* Kustomisasi Scrollbar untuk Daftar Puskesmas */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      
      .loader-spin { animation: spin 1s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="min-h-screen text-gray-800 flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-white/90 backdrop-blur-lg shadow-md sticky top-0 z-50 border-b border-gray-100">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-indigo-600 to-blue-500 text-white p-2.5 rounded-xl shadow-sm">
              <i class="fas fa-notes-medical text-xl"></i>
            </div>
            <span class="font-bold text-2xl tracking-tight text-gray-900">E-Rekap Puskesmas</span>
          </div>
          <div class="flex space-x-8 h-full">
            <button onclick="switchTab('input')" id="tab-input" class="nav-item active flex items-center px-2">
              <i class="fas fa-pen-to-square mr-2 text-lg"></i> Input Data
            </button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-item flex items-center px-2">
              <i class="fas fa-chart-pie mr-2 text-lg"></i> Dashboard
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
      <div class="w-full max-w-4xl">

        <!-- ================= VIEW 1: INPUT DATA ================= -->
        <div id="view-input" class="glass-card p-8 sm:p-12 fade-in max-w-xl mx-auto">
          <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-gray-900">Form Laporan Mingguan</h2>
            <p class="text-base text-gray-600 mt-3">Silahkan masukkan data rekapitulasi terbaru dengan lengkap.</p>
          </div>

          <form id="rekapForm" class="space-y-6" onsubmit="handleFormSubmit(event)">
            
            <!-- Tahap 1: Area Daftar Sheet -->
            <div id="step-1-container" class="fade-in">
              <label class="block text-sm font-bold text-gray-700 mb-3">1. Pilih Kelompok Wilayah (Sheet)</label>
              <div id="sheet-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-72 overflow-y-auto custom-scrollbar pr-2 p-2 bg-white/50 rounded-xl border-2 border-gray-100">
                <div class="col-span-full flex items-center justify-center py-8 text-indigo-500">
                  <i class="fas fa-spinner loader-spin text-3xl"></i>
                  <span class="ml-3 font-medium">Memuat data wilayah...</span>
                </div>
              </div>
            </div>

            <!-- Tahap 2: Area Daftar Puskesmas (Tersembunyi Awalnya) -->
            <div id="step-2-container" class="hidden fade-in">
              <div class="flex items-center justify-between mb-3">
                <label class="block text-sm font-bold text-gray-700">2. Pilih Nama Puskesmas</label>
                <button type="button" onclick="goBackToStep1()" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors bg-indigo-50 px-3 py-1 rounded-lg">
                  <i class="fas fa-arrow-left mr-1"></i> Kembali
                </button>
              </div>
              <div id="puskesmas-list" class="max-h-64 overflow-y-auto custom-scrollbar pr-2 p-2 bg-white/50 rounded-xl border-2 border-indigo-100">
                <!-- List Puskesmas akan dirender di sini -->
              </div>
            </div>

            <!-- Tahap 3: Input Nilai (Tersembunyi Awalnya) -->
            <div id="nilai-container" class="hidden fade-in mt-6">
              <label class="block text-sm font-bold text-gray-700 mb-3">3. Data Rekapitulasi <span id="selected-pusk-label" class="text-indigo-600"></span></label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none text-indigo-500">
                  <i class="fas fa-hashtag text-lg"></i>
                </div>
                <input type="number" id="nilai" placeholder="Masukkan jumlah/nilai..." class="form-input w-full pl-12 pr-5 py-4 rounded-xl border-2 border-gray-200 outline-none transition-all bg-white/70 text-gray-700 font-medium">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full hidden bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg hover:shadow-indigo-500/40 items-center justify-center gap-2 mt-8 text-lg transform hover:-translate-y-1 fade-in">
              <i class="fas fa-cloud-arrow-up text-xl"></i> <span>Simpan Data</span>
            </button>
          </form>
        </div>

        <!-- ================= VIEW 2: DASHBOARD ================= -->
        <div id="view-dashboard" class="hidden fade-in">
          <div class="glass-card p-6 sm:p-8 mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-6">
              <div>
                <h2 class="text-3xl font-extrabold text-gray-900">Capaian Grafik</h2>
                <p class="text-base text-gray-600 mt-2">Visualisasi data mingguan per Puskesmas</p>
              </div>
              <div class="w-full sm:w-80 relative">
                <select id="dashPuskesmas" onchange="renderChart()" class="form-select w-full pl-5 pr-10 py-3 rounded-xl border-2 border-gray-200 outline-none bg-white/70 text-gray-700 font-medium cursor-pointer">
                  <option value="" disabled selected>Pilih Puskesmas...</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-indigo-500"><i class="fas fa-filter text-base"></i></div>
              </div>
            </div>

            <!-- Area Canvas Chart -->
            <div class="relative h-[350px] sm:h-[450px] w-full flex items-center justify-center bg-white/60 rounded-2xl border-2 border-gray-100 p-4 shadow-inner" id="chartContainer">
              <p id="chartEmptyState" class="text-gray-400 flex flex-col items-center gap-3">
                <i class="fas fa-chart-simple text-5xl text-indigo-200"></i>
                <span class="text-lg font-medium">Pilih puskesmas untuk melihat grafik</span>
              </p>
              <canvas id="myChart" class="hidden"></canvas>
            </div>
          </div>

          <!-- Summary Cards Bawah -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="summaryCards" style="display: none;">
            <div class="glass-card p-8 flex items-center gap-6 transform transition hover:-translate-y-1 hover:shadow-xl">
              <div class="bg-gradient-to-tr from-blue-100 to-blue-50 text-blue-600 p-5 rounded-2xl shadow-sm"><i class="fas fa-calendar-check text-3xl"></i></div>
              <div>
                <p class="text-base text-gray-500 font-bold uppercase tracking-wider">Total Minggu Dilaporkan</p>
                <p class="text-4xl font-extrabold text-gray-900 mt-1" id="sumTotalMinggu">0</p>
              </div>
            </div>
            <div class="glass-card p-8 flex items-center gap-6 transform transition hover:-translate-y-1 hover:shadow-xl">
              <div class="bg-gradient-to-tr from-emerald-100 to-emerald-50 text-emerald-600 p-5 rounded-2xl shadow-sm"><i class="fas fa-arrow-trend-up text-3xl"></i></div>
              <div>
                <p class="text-base text-gray-500 font-bold uppercase tracking-wider">Data Terakhir Masuk</p>
                <p class="text-4xl font-extrabold text-gray-900 mt-1" id="sumLastData">0</p>
              </div>
            </div>
          </div>
        </div> <!-- End Dashboard View -->

      </div>
    </main>

    <script>
      // ========================================================================
      // Ganti SCRIPT_URL dengan URL Web App dari Google Apps Script Anda
      // ========================================================================
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysdmQctH6h6AvbC9PsqFPRlTb-fVIuu79CzGuLWbL37i0ZPbx7BcN-zGtc3vtdh-Yn/exec"; 
      
      let myChartInstance = null;
      let globalDashboardData = null; 
      let selectedSheetName = ""; // Variabel penyimpan nama sheet yang diklik

      document.addEventListener('DOMContentLoaded', function() {
        loadSheetNames();
      });

      function switchTab(tab) {
        document.getElementById('view-input').classList.add('hidden');
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('tab-input').classList.remove('active');
        document.getElementById('tab-dashboard').classList.remove('active');

        document.getElementById('view-' + tab).classList.remove('hidden');
        document.getElementById('tab-' + tab).classList.add('active');

        if(tab === 'dashboard') {
          document.getElementById('dashPuskesmas').innerHTML = '<option>Memuat data grafik...</option>';
          if (SCRIPT_URL !== "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI") {
            fetch(`${SCRIPT_URL}?action=getDashboardData`)
              .then(res => res.json())
              .then(data => setupDashboard(data))
              .catch(err => {
                console.warn("Fetch gagal. Menggunakan data simulasi.", err);
                setupDashboard(getDummyDashboardData());
              });
          } else {
            setTimeout(() => setupDashboard(getDummyDashboardData()), 500);
          }
        }
      }

      // ---------------------------------------------------------
      // TAHAP 1: MEMUAT NAMA-NAMA SHEET
      // ---------------------------------------------------------
      function loadSheetNames() {
        if (SCRIPT_URL === "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI") {
          renderSheetList(['Kabupaten Malang', 'Kota Malang']); // Simulasi
          return;
        }

        fetch(`${SCRIPT_URL}?action=getSheetsList`)
          .then(res => res.json())
          .then(data => renderSheetList(data))
          .catch(err => {
            console.warn("Fetch gagal (CORS). Menggunakan data simulasi.", err);
            renderSheetList(['Kabupaten Malang', 'Kota Malang']);
          });
      }

      function renderSheetList(sheets) {
        const container = document.getElementById('sheet-list');
        container.innerHTML = '';

        if (!sheets || sheets.length === 0) {
            container.innerHTML = '<p class="text-center text-gray-500 py-4 col-span-full">Tidak ada Sheet wilayah ditemukan.</p>';
            return;
        }

        let html = '';
        sheets.forEach(sheet => {
          const safeId = 'sheet-' + sheet.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
          html += `
            <label for="${safeId}" class="cursor-pointer relative block">
              <input type="radio" id="${safeId}" name="sheetSelect" value="${sheet}" class="peer sr-only">
              <div class="p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-300 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:shadow-md transition-all flex items-center justify-between text-left">
                <div class="flex items-center gap-3">
                  <div class="bg-indigo-100 text-indigo-600 p-2 rounded-lg"><i class="fas fa-map-location-dot"></i></div>
                  <span class="text-sm font-bold text-gray-700 peer-checked:text-indigo-800">${sheet}</span>
                </div>
                <i class="fas fa-chevron-right text-gray-400 peer-checked:text-indigo-500 transition-colors"></i>
              </div>
            </label>
          `;
        });
        
        container.innerHTML = html;

        // Listener saat Sheet dipilih
        document.querySelectorAll('input[name="sheetSelect"]').forEach(radio => {
          radio.addEventListener('change', function() {
            if(this.checked) {
              selectedSheetName = this.value;
              loadPuskesmasFromSheet(this.value);
            }
          });
        });
      }

      // ---------------------------------------------------------
      // TAHAP 2: MEMUAT PUSKESMAS DARI SHEET TERPILIH
      // ---------------------------------------------------------
      function loadPuskesmasFromSheet(sheetName) {
        // Tampilkan loading di container tahap 2
        document.getElementById('step-1-container').classList.add('hidden');
        document.getElementById('step-2-container').classList.remove('hidden');
        
        const container = document.getElementById('puskesmas-list');
        container.innerHTML = `
          <div class="flex items-center justify-center py-6 text-indigo-500">
            <i class="fas fa-spinner loader-spin text-2xl"></i>
            <span class="ml-3 font-medium">Memuat puskesmas dari ${sheetName}...</span>
          </div>
        `;

        if (SCRIPT_URL === "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI") {
          // Simulasi response berdasarkan sheet
          setTimeout(() => {
            if(sheetName === 'Kabupaten Malang') renderPuskesmasList(['Puskesmas Kepanjen', 'Puskesmas Singosari', 'Puskesmas Lawang']);
            else renderPuskesmasList(['Puskesmas Arjuno', 'Puskesmas Dinoyo', 'Puskesmas Kendalsari']);
          }, 800);
          return;
        }

        fetch(`${SCRIPT_URL}?action=getPuskesmasFromSheet&sheetName=${encodeURIComponent(sheetName)}`)
          .then(res => res.json())
          .then(data => renderPuskesmasList(data))
          .catch(err => {
            console.warn("Fetch Puskesmas gagal. Simulasi aktif.", err);
            renderPuskesmasList(['Puskesmas Simulasi 1', 'Puskesmas Simulasi 2']);
          });
      }

      function renderPuskesmasList(list) {
        const container = document.getElementById('puskesmas-list');
        container.innerHTML = '';

        if (!list || list.length === 0) {
            container.innerHTML = '<p class="text-center text-gray-500 py-4">Belum ada daftar Puskesmas di sheet ini (Kolom A).</p>';
            return;
        }

        let html = '<div class="grid grid-cols-1 gap-2 px-1 py-1">';
        list.forEach(item => {
          const safeId = 'pusk-' + item.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
          html += `
            <label for="${safeId}" class="cursor-pointer relative block">
              <input type="radio" id="${safeId}" name="puskesmas" value="${item}" class="peer sr-only">
              <div class="p-3.5 rounded-xl border-2 border-gray-200 bg-white hover:border-indigo-300 peer-checked:border-indigo-500 peer-checked:bg-indigo-50/80 transition-all flex items-center justify-between shadow-sm">
                <span class="text-sm font-semibold text-gray-700 peer-checked:text-indigo-800">${item}</span>
                <i class="fas fa-check-circle text-indigo-500 opacity-0 peer-checked:opacity-100 transition-opacity text-lg ml-2"></i>
              </div>
            </label>
          `;
        });
        html += `</div>`;
        container.innerHTML = html;

        // Listener saat Puskesmas dipilih
        document.querySelectorAll('input[name="puskesmas"]').forEach(radio => {
          radio.addEventListener('change', function() {
            if(this.checked) {
              document.getElementById('nilai-container').classList.remove('hidden');
              document.getElementById('submitBtn').classList.remove('hidden');
              document.getElementById('submitBtn').classList.add('flex');
              document.getElementById('selected-pusk-label').innerText = "untuk " + this.value;
              
              const nilaiInput = document.getElementById('nilai');
              nilaiInput.required = true;
              setTimeout(() => nilaiInput.focus(), 100);
            }
          });
        });
      }

      // Tombol Kembali ke Pemilihan Sheet
      function goBackToStep1() {
        document.getElementById('step-2-container').classList.add('hidden');
        document.getElementById('nilai-container').classList.add('hidden');
        document.getElementById('submitBtn').classList.add('hidden');
        document.getElementById('submitBtn').classList.remove('flex');
        document.getElementById('step-1-container').classList.remove('hidden');
        
        // Uncheck radio sheet
        const checkedSheet = document.querySelector('input[name="sheetSelect"]:checked');
        if(checkedSheet) checkedSheet.checked = false;
        
        // Reset nilai
        document.getElementById('nilai').value = '';
        document.getElementById('nilai').required = false;
        selectedSheetName = "";
      }

      // ---------------------------------------------------------
      // TAHAP 3: SUBMIT FORM
      // ---------------------------------------------------------
      function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        const selectedRadio = document.querySelector('input[name="puskesmas"]:checked');
        const puskesmas = selectedRadio ? selectedRadio.value : '';
        const nilai = document.getElementById('nilai').value;

        if(!puskesmas || !selectedSheetName) {
            Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Silakan pilih Nama Puskesmas terlebih dahulu!' });
            return;
        }
        if(!nilai) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner loader-spin text-xl"></i> <span>Menyimpan...</span>';
        
        if (SCRIPT_URL !== "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_ANDA_DI_SINI") {
          fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ 
              action: 'saveData', 
              sheetName: selectedSheetName, 
              puskesmas: puskesmas, 
              nilai: nilai 
            }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          })
          .then(res => res.json())
          .then(res => {
            resetSubmitButton(btn);
            if(res.success) {
              Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 2000, showConfirmButton: false });
              resetFormAndGoBack();
              globalDashboardData = null; 
            } else {
              Swal.fire({ icon: 'error', title: 'Gagal', text: res.message });
            }
          })
          .catch(err => {
            console.warn("Fetch gagal. Simulasi simpan.", err);
            resetSubmitButton(btn);
            Swal.fire({ icon: 'success', title: 'Berhasil (Simulasi)', text: 'Data simulasi berhasil disimpan!', timer: 2000, showConfirmButton: false });
            resetFormAndGoBack();
            globalDashboardData = null;
          });
        } else {
          setTimeout(() => {
            resetSubmitButton(btn);
            Swal.fire({ icon: 'success', title: 'Berhasil (Pratinjau)', text: 'Data simulasi berhasil disimpan!', timer: 2000, showConfirmButton: false });
            resetFormAndGoBack();
            globalDashboardData = null;
          }, 1000);
        }
      }

      function resetSubmitButton(btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-cloud-arrow-up text-xl"></i> <span>Simpan Data</span>';
      }

      function resetFormAndGoBack() {
        document.getElementById('nilai').value = '';
        goBackToStep1();
      }

      // ---- FUNGSI DASHBOARD (Tetap) ----
      function setupDashboard(payload) {
        globalDashboardData = payload; 
        const selectDash = document.getElementById('dashPuskesmas');
        selectDash.innerHTML = '<option value="" disabled selected>-- Pilih Puskesmas --</option>';
        
        // Isi dropdown
        Object.keys(payload.data).forEach(pusk => {
          selectDash.appendChild(new Option(pusk, pusk));
        });
      }

      function getDummyDashboardData() {
        return {
          headers: ["Minggu 1", "Minggu 2", "Minggu 3", "Minggu 4"],
          data: {
            "Puskesmas Dinoyo": [10, 15, 20, 25],
            "Puskesmas Kepanjen": [5, 12, 18, 14],
            "Puskesmas Singosari": [20, 22, 19, 30]
          }
        };
      }

      function renderChart() {
        const selectedPusk = document.getElementById('dashPuskesmas').value;
        if(!selectedPusk || !globalDashboardData) return;

        document.getElementById('chartEmptyState').classList.add('hidden');
        document.getElementById('myChart').classList.remove('hidden');
        document.getElementById('summaryCards').style.display = 'grid';

        const ctx = document.getElementById('myChart').getContext('2d');
        const labels = globalDashboardData.headers; 
        const dataValues = globalDashboardData.data[selectedPusk]; 

        document.getElementById('sumTotalMinggu').innerText = dataValues.filter(v => v > 0).length;
        document.getElementById('sumLastData').innerText = dataValues[dataValues.length - 1] || 0;

        if (myChartInstance) myChartInstance.destroy();

        myChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Capaian Mingguan',
              data: dataValues,
              borderColor: '#4f46e5',
              backgroundColor: 'rgba(79, 70, 229, 0.1)',
              borderWidth: 3,
              pointBackgroundColor: '#ffffff',
              pointBorderColor: '#4f46e5',
              pointBorderWidth: 2,
              pointRadius: 5,
              fill: true,
              tension: 0.4 
            },
            {
              type: 'bar',
              label: 'Volume',
              data: dataValues,
              backgroundColor: 'rgba(99, 102, 241, 0.15)',
              borderRadius: 6,
              borderSkipped: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(17, 24, 39, 0.9)',
                padding: 12,
                titleFont: { family: 'Outfit', size: 14 },
                bodyFont: { family: 'Outfit', size: 14 },
                displayColors: false
              }
            },
            scales: {
              y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false } },
              x: { grid: { display: false } }
            }
          }
        });
      }
    </script>
  </body>
</html>
